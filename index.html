<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d5fc4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Training Hub" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" />
    <title>Training Hub</title>
  </head>
  <body>
    <div id="root"><p style="font-family:system-ui,sans-serif;padding:24px;color:#5b6876">Loading Training Hub…</p></div>
    <script>
      window.addEventListener("error", function (e) {
        var r = document.getElementById("root");
        if (r && !r.dataset.mounted) r.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:24px"><h1 style="font-size:22px">Training Hub couldn\'t start</h1><p style="color:#c8352b"></p></div>', r.querySelector("p").textContent = (e.message || "Unknown error");
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
